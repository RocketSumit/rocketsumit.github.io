  summary: >
    Robotics Engineer specializing in robot manipulation, imitation learning, and perception systems.
    Experienced in building and deploying intelligent robotic systems using Python, C++, ROS, and deep learning frameworks.
    Passionate about scalable infrastructure, efficient workflows, and applied robotics research.

