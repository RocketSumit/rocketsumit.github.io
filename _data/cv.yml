        location: Singapore
        start_date: 2023-07
        end_date: 2025-12
        summary: >
          Contributed to the development of the Dyson Robot Learning Lab, focusing on robot manipulation,
          perception systems, and infrastructure for large-scale data collection.
        highlights:
          - Developed scalable infrastructure for collecting human demonstrations using Franka Panda and UR5 robots
          - Worked on hierarchical diffusion policy for multi-task robotic manipulation (featured on CNBC)
          - Designed manipulation tasks, collected 1500+ demonstrations, and ran 10,000+ robot trials
          - Developed perception pipelines using Grounding DINO and SAM
          - Integrated classical vision with ToF sensors for robust perception
          - Designed robotic cleaning mechanisms using embedded systems, stepper and dc motors

