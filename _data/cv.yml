cv:
  name: Sumit Patidar
  label: Senior Robotics Engineer
  location: Singapore
  image: ""
  summary: >
    Robotics Engineer specializing in robot manipulation, perception, imitation learning,
    robotics software, and 3D reconstruction. Experienced across the robotics stack,
    from system design and prototyping to experimentation and real-world deployment.

  social_networks:
    - network: LinkedIn
      username: sumitpatidar
    - network: GitHub
      username: rocketsumit

  sections:
    Experience:
      - company: Dyson
        position: Senior Robotics Engineer, Upstream Robotics (NPI)
        location: Singapore
        start_date: 2026-01
        end_date: Present
        summary: >
          Developing perception and 3D reconstruction systems for autonomous robotics.
        highlights:
          - Developing large-scale 3D scene reconstruction using SfM and Gaussian Splatting

      - company: Dyson
        position: Robotics Engineer, Upstream Robotics (NPI)
        location: Singapore
        start_date: 2023-07
        end_date: 2025-12
        summary: >
          Developed robot learning, perception, motion planning, and mechatronics systems.
        highlights:
          - Built teleoperation, data collection, and evaluation infrastructure on Franka Panda
          - Designed manipulation tasks, collected 2,000+ demonstrations, and conducted 10,000+ robot trials
          - Developed ACT and Diffusion Policy-based manipulation systems
          - Developed perception pipelines using Grounding DINO, SAM, and iToF sensing
          - Developed ROS-based motion planning and behaviors for articulated systems
          - Designed and prototyped robotic mechanisms using CAD, 3D printing, motors, and embedded controllers
          - Presented robotic systems to senior leadership and at James Dyson Foundation events

      - company: Corning
        position: Robotics Engineer Intern
        location: Berlin, Germany
        start_date: 2022-10
        end_date: 2023-01
        highlights:
          - Migrated an industrial robotics codebase from ROS 1 to ROS 2
          - Developed OpenCV-based vision for optical filter detection and height estimation
          - Integrated robot control, vision, and Behavior Trees for automated assembly on Meca500

      - company: Technoyantra
        position: Robotics Engineer Intern
        location: Pune, India (remote)
        start_date: 2021-07
        end_date: 2021-09
        highlights:
          - Developed LiDAR-camera fusion and 3D object detection pipelines using Autoware.AI
          - Calibrated Velodyne LiDAR and monocular camera systems
          - Iterated on perception systems with clients based on project requirements

      - company: Tata Consultancy Services
        position: Robotics Engineer Intern
        location: Noida, India
        start_date: 2018-06
        end_date: 2018-08
        highlights:
          - Built an autonomous image acquisition system using servo motors, Arduino, and cameras
          - Developed ROS 1 perception pipelines using Mask R-CNN
          - Automated robotic image capture for training dataset generation

