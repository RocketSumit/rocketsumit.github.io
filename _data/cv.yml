cv:
  name: Sumit Patidar
  label: Senior Robotics Engineer
  location: Singapore
  image: ""
  summary: >
    Robotics Engineer specializing in robot learning, manipulation, perception, and robotics software.
    Experienced in developing end-to-end autonomous robotic systems spanning imitation learning,
    3D scene reconstruction, motion planning, and mechatronics. Passionate about translating
    research into robust real-world robotic systems through rapid prototyping and large-scale experimentation.

  social_networks:
    - network: LinkedIn
      username: sumitpatidar
    - network: GitHub
      username: rocketsumit

  sections:
    Experience:
      - company: Dyson
        position: Senior Robotics Engineer
        location: Singapore
        start_date: 2026-01
        end_date: Present
        summary: >
          Developing perception and manipulation algorithms for next-generation autonomous robotic systems.
        highlights:
          - Developing large-scale 3D scene reconstruction and mapping pipelines
          - Designed robotic manipulation behaviors for articulated robotic arms

      - company: Dyson
        position: Robotics Engineer
        location: Singapore
        start_date: 2023-07
        end_date: 2025-12
        summary: >
          Contributed to robot learning, perception, motion planning, and robotics infrastructure
          for autonomous robotic systems.
        highlights:
          - Built scalable teleoperated data collection and evaluation infrastructure using Franka Panda and UR5 robots
          - Designed household manipulation tasks and collected 2,000+ demonstrations
          - Conducted 10,000+ robot trials for imitation learning using ACT and Diffusion Policies
          - Developed perception pipelines using Grounding DINO, Segment Anything (SAM), and indirect Time-of-Flight sensing
          - Developed ROS-based motion planning and behaviors for articulated robotic systems
          - Designed robotic mechanisms using CAD, embedded systems, 3D printing, and rapid prototyping
          - Presented robotics demonstrations to senior leadership and represented Dyson at outreach events

