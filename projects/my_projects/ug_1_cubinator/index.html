  </script> </head> <body class="fixed-top-nav "> <header> <nav id="navbar" class="navbar navbar-light navbar-expand-sm fixed-top" role="navigation"> <div class="container"> <a class="navbar-brand title font-weight-lighter" href="/"> <span class="font-weight-bold">Sumit</span> Patidar </a> <button class="navbar-toggler collapsed ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"> <span class="sr-only">Toggle navigation</span> <span class="icon-bar top-bar"></span> <span class="icon-bar middle-bar"></span> <span class="icon-bar bottom-bar"></span> </button> <div class="collapse navbar-collapse text-right" id="navbarNav"> <ul class="navbar-nav ml-auto flex-nowrap"> <li class="nav-item "> <a class="nav-link" href="/">about </a> </li> <li class="nav-item "> <a class="nav-link" href="/blog/">blog </a> </li> <li class="nav-item "> <a class="nav-link" href="/publications/">publications </a> </li> <li class="nav-item active"> <a class="nav-link" href="/projects/">projects🚀 <span class="sr-only">(current)</span> </a> </li> <li class="nav-item "> <a class="nav-link" href="/cv/">CV </a> </li> <li class="nav-item"> <button id="search-toggle" title="Search" onclick="openSearchModal()"> <span class="nav-link">ctrl k <i class="fa-solid fa-magnifying-glass"></i></span> </button> </li> <li class="toggle-container"> <button id="light-toggle" title="Change theme"> <i class="fa-half-sun-moon" id="light-toggle-system"></i> <i class="fa-solid fa-moon" id="light-toggle-dark"></i> <i class="fa-solid fa-sun" id="light-toggle-light"></i> </button> </li> </ul> </div> </div> </nav> <progress id="progress" value="0"> <div class="progress-container"> <span class="progress-bar"></span> </div> </progress> </header> <div class="container mt-5" role="main"> <div class="post"> <header class="post-header"> <h1 class="post-title">Cubinator</h1> <p class="post-description">The Rubik's cube solving robot</p> </header> <article> <div class="row justify-content-sm-center"> <figure> <iframe src="https://www.youtube.com/embed/UdD4uY8Ph30?si=VLm4GNRUDZhBfgLY" class="rounded z-depth-1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="" width="480px" height="360px"/> </figure> </div> <div class="caption"> Cubinator in action! </div> <ul> <li><a href="#the-rise-of-cubinator">The Rise of Cubinator</a></li> <li><a href="#how-cubinator-works">How Cubinator Works?</a></li> <li><a href="#team">Team</a></li> <li><a href="#references">References</a></li> </ul> <h2 id="the-rise-of-cubinator">The Rise of Cubinator</h2> <p>I was in the 2nd semester of my bachelor’s and had been practicing to solve a 3x3 Rubik’s cube quickly for the last few months. My two roommates, Utkarsh and Versha, inspired me to take up Rubik’s cube solving. Those two geniuses could already solve a variety of Rubik’s cubes, some under less than 20 seconds! During that time, we all were enrolled in an Electronics coursework. As part of one of our assignments, we were required to build any working prototype under $20. Since all three of us could solve a 3x3 Rubik’s cube, we thought, why not also make a robot that could solve a Rubik’s cube? We challenged ourselves and completed the project in about 2-3 months. Through this project, I set my foot in the world of electronics, motors, microcontrollers, and fabrication.</p> <h2 id="how-cubinator-works">How Cubinator Works?</h2> <p>Cubinator is an Arduino-powered Rubik’s cube-solving robot. It takes the cube’s initial configuration as a sequence of color tiles on each side of the cube. It then uses God’s algorithm <a href="#1">[1]</a> to output a series of required cube rotations aimed at solving a Rubik’s cube. These rotations are executed via Arudino by controlling DC and servo motors in an open loop. The average time of solving any given configuration is about two minutes.</p> <p>We planned to use the smartphone camera to detect the colors on each side of the cube. However, there was inconsistency in detecting red and orange colors in different lighting conditions. Since we couldn’t resolve the issue in time, we resorted to manually inputting the color sequence through a laptop connected to the Arduino. God’s algorithm processed the input configuration on the laptop, and the cube rotations were sent to the Arduino in a sequence. We also 3D-printed our custom rack and pinion gears, and the claws to hold and rotate the Rubik’s cube sides.</p> <h2 id="team">Team</h2> <p>Sumit Patidar, Utkarsh Kunwar, Versha Dhankar, Vipin Tolia, Shubham</p> <h2 id="references">References</h2> <p><a id="1">[1]</a> God’s algorithm. Wikipedia. Available at: <a href="https://en.wikipedia.org/wiki/God%27s_algorithm">https://en.wikipedia.org/wiki/God%27s_algorithm</a> (Accessed: 5 October 2022)</p> </article> </div> </div> <footer class="fixed-bottom" role="contentinfo"> <div class="container mt-0"> &copy; Copyright 2026 Sumit Patidar. Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme. Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>. Photos from <a href="https://unsplash.com" target="_blank">Unsplash</a>. Last updated: July 25, 2026. </div> </footer> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <scr
